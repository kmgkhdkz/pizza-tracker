<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配達GPS送信</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
    h1 { font-size: 24px; }
    select, button { font-size: 20px; padding: 15px 30px; margin: 10px; border-radius: 10px; }
    .btn-start { background: #28a745; color: white; border: none; width: 80%; }
    .btn-stop { background: #dc3545; color: white; border: none; width: 80%; }
    #status { font-size: 16px; font-weight: bold; margin-top: 20px; color: #333; line-height: 1.5; word-break: break-all; }
  </style>

  <!-- Firebase SDK (v8) -->
  <script src="[suspicious link removed]"></script>
  <script src="[suspicious link removed]"></script>
</head>
<body>

  <h1>🍕 配達GPSTracker</h1>

  <label for="bikeSelect">車両選択：</label><br>
  <select id="bikeSelect">
    <option value="driver_01">01号車</option>
    <option value="driver_02">02号車</option>
    <option value="driver_03">03号車</option>
    <option value="driver_04">04号車</option>
    <option value="driver_05">05号車</option>
  </select>

  <br><br>
  <button id="startBtn" class="btn-start" onclick="startTracking()">▶ 配達開始</button>
  <button id="stopBtn" class="btn-stop" onclick="stopTracking()" style="display:none;">■ 配達完了（帰店）</button>

  <div id="status">待機中...</div>

  <script>
    // Firebase設定値
    const firebaseConfig = {
      apiKey: "AIzaSyBgf38trcys4SOhDhxfTk1d-tCryPvYaL8",
      authDomain: "[suspicious link removed]",
      databaseURL: "[suspicious link removed]",
      projectId: "pizza-tracker-42bd1",
      storageBucket: "[不審なリンクを削除しました]",
      messagingSenderId: "115595805951",
      appId: "1:115595805951:web:ae5d7a5d171d7206ce38ca"
    };

    let db = null;
    let watchId = null;

    // Firebase初期化を安全に実行
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.error("Firebase初期化エラー:", e);
    }

    function startTracking() {
      const statusDiv = document.getElementById('status');
      const bikeId = document.getElementById('bikeSelect').value;

      statusDiv.innerText = "⏳ 1/3: GPS取得中...";

      if (!navigator.geolocation) {
        statusDiv.innerText = "❌ GPS非対応端末です";
        return;
      }

      if (!db) {
        statusDiv.innerText = "❌ Firebase初期化に失敗しています";
        return;
      }

      document.getElementById('startBtn').style.display = "none";
      document.getElementById('stopBtn').style.display = "inline-block";

      // リアルタイム位置情報取得開始
      watchId = navigator.geolocation.watchPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          statusDiv.innerText = "📡 2/3: GPS取得成功！Firebase送信中...\n(" + bikeId + ": " + lat.toFixed(4) + ", " + lng.toFixed(4) + ")";

          // Firebaseへデータを書き込み
          db.ref('drivers/' + bikeId).set({
            lat: lat,
            lng: lng,
            updatedAt: [不審なリンクを削除しました](),
            status: "active"
          }).then(() => {
            statusDiv.innerText = "🟢 3/3: 送信成功！リアルタイム追跡中 (" + bikeId + ")";
          }).catch(err => {
            statusDiv.innerText = "❌ Firebase送信エラー: " + err.message;
          });
        },
        error => {
          statusDiv.innerText = "❌ GPSエラー: " + error.message;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    }

    function stopTracking() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      const bikeId = document.getElementById('bikeSelect').value;
      if (db) {
        db.ref('drivers/' + bikeId).update({ status: "inactive" });
      }

      document.getElementById('startBtn').style.display = "inline-block";
      document.getElementById('stopBtn').style.display = "none";
      document.getElementById('status').innerText = "停止しました（待機中）";
    }
  </script>
</body>
</html>
</html>

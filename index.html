<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202938">
  <title>店舗配達リアルタイムモニター</title>

  <!-- Leaflet: 地図表示 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Firebase SDK v8 (Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root { color-scheme: light; --ink:#202938; --muted:#667085; --line:#e5e7eb; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { display:flex; flex-direction:column; background:#f4f6f8; color:var(--ink); }
    #header { min-height:62px; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--ink); color:#fff; }
    .brand { font-weight:800; font-size:17px; letter-spacing:.02em; }
    .subhead { font-size:12px; color:#cbd5e1; margin-top:3px; }
    .header-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .badge { border-radius:999px; padding:7px 11px; background:#334155; font-size:13px; font-weight:700; white-space:nowrap; }
    .badge.good { background:#166534; }
    .badge.bad { background:#991b1b; }
    #toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:9px 12px; background:#fff; border-bottom:1px solid var(--line); }
    button, select { font:inherit; font-size:13px; padding:8px 11px; border:1px solid #d0d5dd; border-radius:8px; background:#fff; color:var(--ink); }
    button { cursor:pointer; font-weight:650; }
    button:active { transform:translateY(1px); }
    #lastUpdate { margin-left:auto; color:var(--muted); font-size:12px; }
    #notice { display:none; padding:10px 14px; background:#fff4e5; color:#7a3e00; border-bottom:1px solid #fed7aa; font-size:13px; }
    #workspace { display:flex; flex:1; min-height:0; width:100%; }
    #map { flex:1; min-height:220px; min-width:0; width:100%; background:#e8edf1; }
    #vehicleSidebar { width:280px; flex:0 0 280px; overflow-y:auto; background:#fff; border-left:1px solid var(--line); }
    #vehicleSidebar.hidden { display:none; }
    .sidebar-heading { position:sticky; top:0; z-index:2; padding:12px; background:#f8fafc; border-bottom:1px solid var(--line); font-weight:800; }
    #vehicleList { padding:8px; display:flex; flex-direction:column; gap:7px; }
    .vehicle-item { width:100%; display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; padding:10px; border:1px solid var(--line); border-radius:9px; background:#fff; }
    .vehicle-item:active { transform:none; }
    .vehicle-name { font-weight:800; font-size:13px; }
    .vehicle-status { font-size:12px; color:var(--muted); }
    .vehicle-status.active { color:#15803d; }
    .vehicle-status.stale { color:#b45309; }
    .vehicle-updated { font-size:11px; color:var(--muted); }
    .bike-icon { background:transparent; border:0; }
    .bike-pin { width:38px; height:38px; display:flex; align-items:center; justify-content:center; border:3px solid #fff; border-radius:50%; box-shadow:0 2px 9px #0005; font-size:20px; }
    .bike-pin.active { background:#16a34a; }
    .bike-pin.waiting { background:#64748b; }
    .bike-pin.stale { background:#d97706; }
    .leaflet-popup-content { margin:12px 14px; }
    .popup-title { font-weight:800; font-size:15px; margin-bottom:5px; }
    .popup-row { font-size:13px; line-height:1.7; }
    .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
    .dot-active { background:#16a34a; } .dot-waiting { background:#94a3b8; } .dot-stale { background:#d97706; }
    @media (max-width:600px) {
      #header { align-items:flex-start; padding:10px 12px; }
      .brand { font-size:15px; }
      .subhead { max-width:190px; }
      .header-right { gap:6px; }
      .badge { font-size:12px; padding:6px 8px; }
      #lastUpdate { width:100%; margin-left:0; }
      #toolbar { gap:6px; }
      button { padding:8px 9px; }
      #vehicleSidebar { width:44%; flex-basis:44%; }
      .sidebar-heading { padding:9px 8px; font-size:13px; }
      #vehicleList { padding:5px; gap:5px; }
      .vehicle-item { padding:8px 7px; }
      .vehicle-name { font-size:12px; }
      .vehicle-status { font-size:11px; }
    }
  </style>
</head>
<body>
  <header id="header">
    <div>
      <div class="brand">🍕 店舗配達リアルタイムモニター</div>
      <div class="subhead">配達用スマホの位置情報をリアルタイム表示</div>
    </div>
    <div class="header-right">
      <span id="connectionBadge" class="badge">接続確認中…</span>
      <span id="activeCount" class="badge good">配達中 0台</span>
    </div>
  </header>

  <div id="toolbar">
    <button id="toggleSidebarButton" type="button" aria-controls="vehicleSidebar" aria-expanded="true">☰ 車両一覧を隠す</button>
    <button id="fitButton" type="button">📍 バイク全体を表示</button>
    <button id="refreshButton" type="button">↻ 再接続</button>
    <label for="filter" style="font-size:13px;font-weight:650;">表示：</label>
    <select id="filter" aria-label="表示するバイク">
      <option value="all">すべて</option>
      <option value="active">配達中のみ</option>
      <option value="waiting">待機中のみ</option>
    </select>
    <span id="lastUpdate">最終受信：未受信</span>
  </div>

  <div id="notice" role="status"></div>
  <div id="workspace">
    <main id="map" aria-label="配達バイク位置地図"></main>
    <aside id="vehicleSidebar" aria-label="配達車両一覧">
      <div class="sidebar-heading">🛵 車両一覧（9台）</div>
      <div id="vehicleList"></div>
    </aside>
  </div>

  <script>
    /*
     * 【公開前に必ず確認】
     * databaseURL は Firebase Console > Realtime Database に表示される
     * データベースURLを、そのまま設定してください。
     * 下記の例と違うURLが表示されている場合は、Firebase Consoleの値を優先します。
     */
    const firebaseConfig = {
      apiKey: "AIzaSyBgf38trcys4SOhDhxfTk1d-tCryPvYaL8",
      authDomain: "pizza-tracker-42bd1.firebaseapp.com",
      databaseURL: "https://pizza-tracker-42bd1-default-rtdb.firebaseio.com",
      projectId: "pizza-tracker-42bd1",
      storageBucket: "pizza-tracker-42bd1.appspot.com",
      messagingSenderId: "115595805951",
      appId: "1:115595805951:web:ae5d7a5d171d7206ce38ca"
    };

    // 表示・運用設定
    const DRIVERS_PATH = "drivers";

    // Firebase管理IDと実車番の対応表
    const VEHICLE_PLATES = {
      driver_01: "86716",
      driver_02: "86717",
      driver_03: "86718",
      driver_04: "13391",
      driver_05: "13392",
      driver_06: "13393",
      driver_07: "13395",
      driver_08: "15621",
      driver_09: "13809"
    };

    function vehicleLabel(driverId) {
      const number = String(driverId).replace("driver_", "");
      const plate = VEHICLE_PLATES[driverId];
      return plate ? `${number}号車（車番 ${plate}）` : String(driverId);
    }
    const STALE_AFTER_MS = 30 * 1000; // 最終更新から30秒経過したら通信切れとして表示
    const ANIMATION_MS = 700;              // ピンの移動アニメーション時間
    const DEFAULT_CENTER = [34.3853, 132.4553]; // 初期表示：広島市付近。位置受信後は必要に応じて自動調整

    const markers = Object.create(null);
    let dbRef = null;
    let driversListener = null;
    let connectionListener = null;
    let hasReceivedFirstSnapshot = false;
    let latestDrivers = {};
    let hasAutoFitted = false;

    const map = L.map("map", { zoomControl: true }).setView(DEFAULT_CENTER, 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[ch]));
    }

    function validCoordinate(value, min, max) {
      return typeof value === "number" && Number.isFinite(value) && value >= min && value <= max;
    }

    function getCoordinates(driver) {
      // Accept numbers and numeric strings, but reject empty strings/null.
      const lat = driver && driver.lat !== "" && driver.lat != null ? Number(driver.lat) : NaN;
      const lng = driver && driver.lng !== "" && driver.lng != null ? Number(driver.lng) : NaN;
      if (!validCoordinate(lat, -90, 90) || !validCoordinate(lng, -180, 180)) return null;
      return [lat, lng];
    }

    function getTimestamp(driver) {
      // Supports common field names; Firebase server timestamps may be numbers.
      const raw = driver.updatedAt ?? driver.timestamp ?? driver.lastUpdate ?? driver.updated_at;
      if (typeof raw === "number" && Number.isFinite(raw)) return raw;
      if (typeof raw === "string") {
        const parsed = Date.parse(raw);
        if (Number.isFinite(parsed)) return parsed;
      }
      return null;
    }

    function getStatus(driver) {
      return String(driver && driver.status || "").toLowerCase() === "active" ? "active" : "waiting";
    }

    function isStale(driver) {
      const time = getTimestamp(driver);
      return time !== null && (Date.now() - time > STALE_AFTER_MS || time - Date.now() > 5 * 60 * 1000);
    }

    function statusLabel(driver) {
      if (isStale(driver)) return "待機中（通信が切れました）";
      return getStatus(driver) === "active" ? "配達中" : "待機中／帰店";
    }

    function formatTime(timestamp) {
      if (timestamp === null) return "送信時刻なし";
      return new Date(timestamp).toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
    }

    function renderVehicleList(drivers) {
      const list = document.getElementById("vehicleList");
      const entries = Object.entries(VEHICLE_PLATES).map(([id, plate]) => {
        const driver = drivers && drivers[id];
        const coords = driver ? getCoordinates(driver) : null;
        const hasData = !!(driver && coords);
        const stale = hasData && isStale(driver);
        let label = "位置情報未受信";
        let stateClass = "";
        if (hasData && stale) {
          label = "待機中（通信が切れました）";
          stateClass = "stale";
        } else if (hasData && getStatus(driver) === "active") {
          label = "配達中";
          stateClass = "active";
        } else if (hasData) {
          label = "待機中／帰店";
        }
        const updated = hasData ? `最終更新：${formatTime(getTimestamp(driver))}` : "最終更新：—";
        return `<button class="vehicle-item" type="button" data-driver-id="${id}">
          <span class="vehicle-name">${id.replace("driver_", "")}号車（車番 ${plate}）</span>
          <span class="vehicle-status ${stateClass}">${escapeHtml(label)}</span>
          <span class="vehicle-updated">${escapeHtml(updated)}</span>
        </button>`;
      }).join("");
      list.innerHTML = entries;
      list.querySelectorAll("[data-driver-id]").forEach(button => {
        button.addEventListener("click", () => {
          const id = button.dataset.driverId;
          const marker = markers[id];
          if (!marker) {
            document.getElementById("notice").style.display = "block";
            document.getElementById("notice").textContent = `${vehicleLabel(id)} の位置情報はまだありません。`;
            return;
          }
          if (!map.hasLayer(marker)) {
            document.getElementById("filter").value = "all";
            renderDrivers(latestDrivers, false, false);
          }
          map.setView(marker.getLatLng(), Math.max(map.getZoom(), 16));
          marker.openPopup();
        });
      });
    }

    function popupContent(bikeId, driver) {
      const coords = getCoordinates(driver);
      const timestamp = getTimestamp(driver);
      const status = statusLabel(driver);
      const dotClass = isStale(driver) ? "dot-stale" : (getStatus(driver) === "active" ? "dot-active" : "dot-waiting");
      return `<div>
        <div class="popup-title">🛵 ${escapeHtml(vehicleLabel(bikeId))}</div>
        <div class="popup-row"><span class="status-dot ${dotClass}"></span>状態：${escapeHtml(status)}</div>
        <div class="popup-row">緯度：${coords ? coords[0].toFixed(6) : "—"}</div>
        <div class="popup-row">経度：${coords ? coords[1].toFixed(6) : "—"}</div>
        <div class="popup-row">最終更新：${escapeHtml(formatTime(timestamp))}</div>
      </div>`;
    }

    function makeBikeIcon(driver) {
      const stateClass = isStale(driver) ? "stale" : (getStatus(driver) === "active" ? "active" : "waiting");
      return L.divIcon({
        className: "bike-icon",
        html: `<div class="bike-pin ${stateClass}" aria-label="配達バイク">🛵</div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 19],
        popupAnchor: [0, -18]
      });
    }

    function animateMarker(marker, from, to, duration) {
      if (marker._animationFrame) cancelAnimationFrame(marker._animationFrame);
      if (!from || !to || (from[0] === to[0] && from[1] === to[1])) {
        marker.setLatLng(to);
        return;
      }
      const start = performance.now();
      function step(now) {
        const progress = Math.min(1, (now - start) / duration);
        // Ease-in-out for a less abrupt visual transition.
        const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        marker.setLatLng([
          from[0] + (to[0] - from[0]) * eased,
          from[1] + (to[1] - from[1]) * eased
        ]);
        if (progress < 1) marker._animationFrame = requestAnimationFrame(step);
        else marker._animationFrame = null;
      }
      marker._animationFrame = requestAnimationFrame(step);
    }

    function visibleByFilter(driver) {
      const filter = document.getElementById("filter").value;
      if (filter === "active") return getStatus(driver) === "active" && !isStale(driver);
      if (filter === "waiting") return getStatus(driver) !== "active" || isStale(driver);
      return true;
    }

    function renderDrivers(drivers, autoFitIfFirst = false, updateReceivedTime = true) {
      latestDrivers = drivers || {};
      let activeCount = 0;
      let validCount = 0;
      const bounds = [];
      const knownIds = new Set(Object.keys(latestDrivers));

      Object.keys(markers).forEach(id => {
        if (!knownIds.has(id)) {
          map.removeLayer(markers[id]);
          delete markers[id];
        }
      });

      Object.entries(latestDrivers).forEach(([bikeId, driver]) => {
        if (!driver || typeof driver !== "object") return;
        const coords = getCoordinates(driver);
        if (!coords) return;

        validCount++;
        if (getStatus(driver) === "active" && !isStale(driver)) activeCount++;
        bounds.push(coords);

        let marker = markers[bikeId];
        if (!marker) {
          marker = L.marker(coords, { icon: makeBikeIcon(driver), title: vehicleLabel(bikeId) }).addTo(map);
          marker.bindPopup(popupContent(bikeId, driver));
          markers[bikeId] = marker;
        } else {
          const old = marker.getLatLng();
          animateMarker(marker, [old.lat, old.lng], coords, ANIMATION_MS);
          marker.setIcon(makeBikeIcon(driver));
          marker.setPopupContent(popupContent(bikeId, driver));
        }

        if (visibleByFilter(driver)) {
          if (!map.hasLayer(marker)) marker.addTo(map);
        } else if (map.hasLayer(marker)) {
          map.removeLayer(marker);
        }
      });

      document.getElementById("activeCount").textContent = `配達中 ${activeCount}台`;
      renderVehicleList(latestDrivers);
      if (updateReceivedTime) {
        document.getElementById("lastUpdate").textContent =
          `最終受信：${new Date().toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit", second:"2-digit"})}`;
      }

      if (autoFitIfFirst && !hasAutoFitted && bounds.length > 0) {
        fitAllDrivers();
        hasAutoFitted = true;
      }

      const notice = document.getElementById("notice");
      if (validCount === 0) {
        notice.style.display = "block";
        notice.textContent = "位置情報を待っています。スマホ側で配達開始を押し、Firebaseの drivers に lat・lng が送信されているか確認してください。";
      } else {
        notice.style.display = "none";
      }
    }

    function fitAllDrivers() {
      const points = [];
      Object.entries(latestDrivers).forEach(([id, driver]) => {
        if (!driver || !getCoordinates(driver) || !visibleByFilter(driver)) return;
        points.push(getCoordinates(driver));
      });
      if (points.length === 1) {
        map.setView(points[0], Math.max(map.getZoom(), 15));
      } else if (points.length > 1) {
        map.fitBounds(points, { padding: [40, 40], maxZoom: 16 });
      } else {
        map.setView(DEFAULT_CENTER, 13);
      }
    }

    function setConnection(ok, message) {
      const badge = document.getElementById("connectionBadge");
      badge.textContent = message;
      badge.className = "badge " + (ok ? "good" : "bad");
    }

    function disconnectListeners() {
      if (dbRef && driversListener) dbRef.off("value", driversListener);
      if (connectionListener && firebase.database) {
        firebase.database().ref(".info/connected").off("value", connectionListener);
      }
      driversListener = null;
      connectionListener = null;
    }

    function connectFirebase() {
      disconnectListeners();
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        dbRef = database.ref(DRIVERS_PATH);

        connectionListener = snapshot => {
          const connected = snapshot.val() === true;
          setConnection(connected, connected ? "Firebase接続中" : "接続待機中");
        };
        database.ref(".info/connected").on("value", connectionListener, error => {
          console.error("接続状態の取得エラー:", error);
          setConnection(false, "接続エラー");
        });

        driversListener = snapshot => {
          hasReceivedFirstSnapshot = true;
          renderDrivers(snapshot.val() || {}, true);
        };
        dbRef.on("value", driversListener, error => {
          console.error("Realtime Database読み取りエラー:", error);
          setConnection(false, "読取エラー");
          const notice = document.getElementById("notice");
          notice.style.display = "block";
          notice.textContent = "Firebaseのデータを読み取れません。databaseURL、Realtime Databaseのルール、接続設定を確認してください。";
        });
      } catch (error) {
        console.error("Firebase初期化エラー:", error);
        setConnection(false, "設定エラー");
        const notice = document.getElementById("notice");
        notice.style.display = "block";
        notice.textContent = "Firebaseの初期化に失敗しました。index.html内のfirebaseConfigを確認してください。";
      }
    }

    const sidebar = document.getElementById("vehicleSidebar");
    const sidebarToggle = document.getElementById("toggleSidebarButton");
    sidebarToggle.addEventListener("click", () => {
      const isHidden = sidebar.classList.toggle("hidden");
      sidebarToggle.textContent = isHidden ? "☰ 車両一覧を表示" : "☰ 車両一覧を隠す";
      sidebarToggle.setAttribute("aria-expanded", String(!isHidden));
      setTimeout(() => map.invalidateSize(), 180);
    });

    document.getElementById("fitButton").addEventListener("click", fitAllDrivers);
    document.getElementById("refreshButton").addEventListener("click", connectFirebase);
    document.getElementById("filter").addEventListener("change", () => renderDrivers(latestDrivers, false));

    connectFirebase();

    // 最終更新から30秒を超えたら、データ受信がなくても状態表示を更新する。
    // 定期再描画では「最終受信」時刻を更新しない。
    setInterval(() => {
      if (hasReceivedFirstSnapshot) renderDrivers(latestDrivers, false, false);
    }, 1000);

    // タブ復帰時に地図サイズを再計算（iPadでの表示崩れ防止）
    window.addEventListener("resize", () => map.invalidateSize());
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) setTimeout(() => map.invalidateSize(), 150);
    });
  </script>
</body>
</html>

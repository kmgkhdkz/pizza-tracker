<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗用 配達車両位置モニター</title>

  <!-- Leaflet CSS (地図表示用) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Firebase SDK (v8/v9互換ライブラリ) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #343a40;
      color: #ffffff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 50px);
      position: relative;
    }

    /* 地図エリア */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
    }

    /* サイドバー（車両一覧表示） */
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-left: 1px solid #dee2e6;
      overflow-y: auto;
      padding: 15px;
      box-shadow: -2px 0 5px rgba(0,0,0,0.05);
    }

    .sidebar h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #007bff;
      color: #495057;
    }

    .driver-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .driver-card:hover {
      background: #e9ecef;
      border-color: #adb5bd;
    }

    .driver-card.active {
      border-left: 4px solid #28a745;
    }

    .driver-card.inactive {
      border-left: 4px solid #6c757d;
      opacity: 0.7;
    }

    .driver-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .car-number {
      font-size: 16px;
      font-weight: bold;
      color: #212529;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .badge-active { background: #d4edda; color: #155724; }
    .badge-inactive { background: #e2e3e5; color: #383d41; }

    .driver-info {
      font-size: 12px;
      color: #6c757d;
      line-height: 1.4;
    }

    /* カスタムマーカーアイコンのCSS */
    .custom-marker {
      background: #ffffff;
      border: 2px solid #007bff;
      border-radius: 20px;
      padding: 4px 8px;
      font-weight: bold;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🛵 店舗用 配達車両リアルタイムモニター</h1>
    <span id="active-count" style="font-size: 14px;">稼働中: 0 / 9 台</span>
  </header>

  <div class="main-container">
    <!-- 地図領域 -->
    <div id="map"></div>

    <!-- サイドバー領域 -->
    <div class="sidebar">
      <h2>配達車両一覧</h2>
      <div id="driver-list">
        <!-- JSで動的に一覧を生成 -->
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. 車両定義 (全9台の対応表)
    // -------------------------------------------------------------
    const VEHICLES = {
      "driver_01": { carNum: "86716" },
      "driver_02": { carNum: "86717" },
      "driver_03": { carNum: "86718" },
      "driver_04": { carNum: "13391" },
      "driver_05": { carNum: "13392" },
      "driver_06": { carNum: "13393" },
      "driver_07": { carNum: "13395" },
      "driver_08": { carNum: "15621" },
      "driver_09": { carNum: "13809" }
    };

    // -------------------------------------------------------------
    // 2. Firebase設定
    // -------------------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://pizza-tracker-42bd1-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // -------------------------------------------------------------
    // 3. 地図 (Leaflet) の初期化
    // -------------------------------------------------------------
    // デフォルト位置 (東京駅周辺 / 必要に応じて店舗座標に変更可)
    const map = L.map('map').setView([35.681236, 139.767125], 14);

    // OpenStreetMapのタイルを使用
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 各車両の Leaflet マーカーオブジェクトを保持するオブジェクト
    const markers = {};

    // -------------------------------------------------------------
    // 4. カスタムマーカーアイコン生成用関数
    // -------------------------------------------------------------
    function createCustomIcon(carNum) {
      return L.divIcon({
        className: 'custom-icon-wrapper',
        html: `<div class="custom-marker">🛵 <b>${carNum}</b></div>`,
        iconSize: [80, 30],
        iconAnchor: [40, 15]
      });
    }

    // -------------------------------------------------------------
    // 5. Firebase Realtime Database 監視・同期処理
    // -------------------------------------------------------------
    const driversRef = database.ref('drivers');

    driversRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      let activeCount = 0;

      const driverListEl = document.getElementById('driver-list');
      driverListEl.innerHTML = ''; // 一覧の再描写

      // 設定された全9台のループ処理
      Object.keys(VEHICLES).forEach((driverId) => {
        const vehicle = VEHICLES[driverId];
        const driverData = data[driverId];

        const isActive = driverData && driverData.status === 'active' && driverData.lat && driverData.lng;
        if (isActive) activeCount++;

        // 1. 地図上のマーカー更新
        if (isActive) {
          const latLng = [driverData.lat, driverData.lng];

          if (markers[driverId]) {
            // 既存マーカーの位置を移動
            markers[driverId].setLatLng(latLng);
          } else {
            // 新規マーカー作成
            markers[driverId] = L.marker(latLng, {
              icon: createCustomIcon(vehicle.carNum)
            }).addTo(map);

            // マーカークリック時のポップアップ
            markers[driverId].bindPopup(`<b>車番: ${vehicle.carNum}</b><br>管理ID: ${driverId}`);
          }
        } else {
          // 待機中（非アクティブ）の場合はマップ上のピンを消去
          if (markers[driverId]) {
            map.removeLayer(markers[driverId]);
            delete markers[driverId];
          }
        }

        // 2. サイドバーの車両カード追加
        const card = document.createElement('div');
        card.className = `driver-card ${isActive ? 'active' : 'inactive'}`;

        const lastUpdated = driverData && driverData.updatedAt
          ? new Date(driverData.updatedAt).toLocaleTimeString('ja-JP')
          : '未受信';

        card.innerHTML = `
          <div class="driver-header">
            <span class="car-number">🛵 車番: ${vehicle.carNum}</span>
            <span class="status-badge ${isActive ? 'badge-active' : 'badge-inactive'}">
              ${isActive ? '配達中' : '待機中'}
            </span>
          </div>
          <div class="driver-info">
            管理ID: ${driverId}<br>
            ${isActive ? `最終更新: ${lastUpdated}` : '配達停止中'}
          </div>
        `;

        // サイドバーのカードクリック時に該当ピンまでマップ移動
        if (isActive) {
          card.onclick = () => {
            map.flyTo([driverData.lat, driverData.lng], 16, { animate: true });
            markers[driverId].openPopup();
          };
        }

        driverListEl.appendChild(card);
      });

      // 稼働台数の表示更新
      document.getElementById('active-count').innerText = `配達中: ${activeCount} / 9 台`;
    });
  </script>
</body>
</html>

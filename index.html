<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗用 配達リアルタイムモニター</title>

  <!-- Leaflet CSS & JS (地図ライブラリ) -->
  <link rel="stylesheet" href="[suspicious link removed]" />
  <script src="[suspicious link removed]"></script>

  <!-- Firebase SDK -->
  <script src="[suspicious link removed]"></script>
  <script src="[suspicious link removed]"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; display: flex; flex-direction: column; }
    #header { background: #333; color: white; padding: 12px 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    #alertBanner { background: #ff3333; color: white; padding: 10px; text-align: center; font-size: 20px; font-weight: bold; display: none; }
    #map { flex: 1; width: 100%; min-height: 400px; }
  </style>
</head>
<body>

  <div id="header">
    <span>🍕 配達状況リアルタイムモニター</span>
    <span id="activeCount">稼働中: 0台</span>
  </div>
  <div id="alertBanner">⚠️ 車両が店舗500m圏内に接近中！</div>
  <div id="map"></div>

  <script>
    // Firebase設定値
   const firebaseConfig = { apiKey: "AIzaSy...", authDomain: "pizza-tracker.firebaseapp.com", databaseURL: "https://pizza-tracker-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "pizza-tracker", storageBucket: "pizza-tracker.appspot.com", messagingSenderId: "123456789", appId: "1:123456789:web:abcdef..." };
    // Firebase初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 店舗の基準位置（矢野駅前店）
    const STORE_LAT = 34.3519265487035;
    const STORE_LNG = 132.53266164179016;

    // 地図の初期化
    const map = [不審なリンクを削除しました]('map').setView([STORE_LAT, STORE_LNG], 14);

    // 地図タイルの読み込み (OpenStreetMap)
    L.tileLayer('[suspicious link removed]{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 店舗のマーカーと500mアラート圏を表示
    L.marker([STORE_LAT, STORE_LNG]).addTo(map).bindPopup("<b>店舗（矢野駅前店）</b>").openPopup();
    [不審なリンクを削除しました]([STORE_LAT, STORE_LNG], { radius: 500, color: 'red', fillColor: '#f03', fillOpacity: 0.1 }).addTo(map);

    // 各バイクのピンを保持するオブジェクト
    const bikeMarkers = {};

    // 距離計算関数（メートル）
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // データベースの変更を常時監視
    db.ref('drivers').on('value', snapshot => {
      const drivers = snapshot.val();
      if (!drivers) return;

      let activeCount = 0;
      let nearStoreAlert = false;

      Object.keys(drivers).forEach(bikeId => {
        const driver = drivers[bikeId];

        if (driver.status === 'active' && [不審なリンクを削除しました] && driver.lng) {
          activeCount++;
          const dist = getDistance(STORE_LAT, STORE_LNG, [不審なリンクを削除しました], driver.lng);

          if (dist <= 500) nearStoreAlert = true;

          const pos = [[不審なリンクを削除しました], driver.lng];

          if (bikeMarkers[bikeId]) {
            bikeMarkers[bikeId].setLatLng(pos);
          } else {
            bikeMarkers[bikeId] = L.marker(pos).addTo(map);
          }

          const bikeLabel = bikeId.replace('driver_', '') + '号車';
          bikeMarkers[bikeId].bindTooltip('🛵 ' + bikeLabel + ' (' + Math.round(dist) + 'm)', { permanent: true, direction: 'top' });
        } else {
          if (bikeMarkers[bikeId]) {
            map.removeLayer(bikeMarkers[bikeId]);
            delete bikeMarkers[bikeId];
          }
        }
      });

      document.getElementById('activeCount').innerText = '稼働中: ' + activeCount + '台';
      document.getElementById('alertBanner').style.display = nearStoreAlert ? 'block' : 'none';
    });
  </script>
</body>
</html>
